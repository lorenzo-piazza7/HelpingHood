spring.application.name=HelpingHood
debug=true
spring.thymeleaf.check-template=false

spring.datasource.url=jdbc:mysql://localhost:3306/helpinghood
spring.datasource.username=root
spring.datasource.password=
server.servlet.session.tracking-modes=cookie
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.demo.giovane-id=${DEMO_GIOVANE_ID:2}
app.demo.richiedente-id=${DEMO_RICHIEDENTE_ID:5}
app.demo.base-lat=${DEMO_BASE_LAT:45.8565}
app.demo.base-lon=${DEMO_BASE_LON:9.3967}
