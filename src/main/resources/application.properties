spring.application.name=HelpingHood
spring.thymeleaf.cache=false

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helping_hood}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.demo.giovane-id=${DEMO_GIOVANE_ID:2}
app.demo.richiedente-id=${DEMO_RICHIEDENTE_ID:5}
app.demo.base-lat=${DEMO_BASE_LAT:45.8565}
app.demo.base-lon=${DEMO_BASE_LON:9.3967}
