spring.application.name=HelpingHood
debug=true
spring.thymeleaf.check-template=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helping_hood}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.servlet.session.tracking-modes=cookie
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# OpenStreetMap itself does not issue API keys. Use the default tile URL for
# development or replace it with a compatible provider URL containing your key.
app.maps.tile-url=${MAP_TILE_URL:https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
app.maps.attribution=${MAP_ATTRIBUTION:© OpenStreetMap contributors}
