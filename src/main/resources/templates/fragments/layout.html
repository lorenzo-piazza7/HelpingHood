<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | HelpingHood'">HelpingHood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<nav th:fragment="navbar(active)" class="top-nav">
    <a class="logo" th:href="@{/}">HelpingHood</a>
    <div class="nav-links">
        <a th:classappend="${active == 'lavori'} ? 'active'" th:href="@{/lavori}">Lavori</a>
        <a th:classappend="${active == 'giovane'} ? 'active'" th:href="@{/dashboard/giovane}">Dashboard Giovane</a>
        <a th:classappend="${active == 'richiedente'} ? 'active'" th:href="@{/dashboard/richiedente}">Dashboard Richiedente</a>
        <a th:classappend="${active == 'chat'} ? 'active'" th:href="@{/chat}">Chat</a>
    </div>
    <a class="btn btn-sm" th:href="@{/auth}">Accedi</a>
</nav>
</body>
</html>
