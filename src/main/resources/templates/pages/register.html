<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrazione')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('register')}"></div>
<main class="container narrow">
    <!-- Form onboarding: crea account e imposta il ruolo iniziale. -->
    <section class="card register-card">
        <h1>Crea il tuo account</h1>
        <p class="register-intro">Compila tutti i campi richiesti per completare la registrazione.</p>

        <p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <!-- Blocchi separati per migliorare la compilazione guidata del form. -->
        <form class="form-grid register-form" method="post" th:action="@{/register}" data-geocode-location>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="latitudine" th:value="${latitudine}">
            <input type="hidden" name="longitudine" th:value="${longitudine}">

            <p class="form-section-title full">Dati anagrafici</p>
            <label>Nome
                <input type="text" name="nome" th:value="${nome}" required>
            </label>
            <label>Cognome
                <input type="text" name="cognome" th:value="${cognome}" required>
            </label>
            <label>Data di nascita
                <input type="date"
                       name="dataNascita"
                       th:value="${dataNascita}"
                       th:min="${minDataNascita}"
                       th:max="${maxDataNascita}"
                       required>
                <small class="field-help">Per i giovani è richiesto avere tra 14 e 25 anni.</small>
            </label>
            <label>Citta
                <input type="text" name="citta" th:value="${citta}" required>
            </label>

            <p class="form-section-title full">Credenziali</p>
            <label>Email
                <input type="email" name="email" th:value="${email}" required>
            </label>
            <label>Password
                <input type="password" name="password" required minlength="8">
            </label>
            <label>Conferma password
                <input type="password" name="confermaPassword" required minlength="8">
            </label>

            <p class="form-section-title full">Ruolo e contatti</p>
            <label class="full">Ruolo
                <select id="registration-role" name="ruolo" required>
                    <option value="giovane" th:selected="${ruolo == null || ruolo == 'giovane'}">Giovane</option>
                    <option value="richiedente" th:selected="${ruolo == 'richiedente'}">Richiedente</option>
                </select>
            </label>
            <label>Telefono
                <input type="tel" name="telefono" th:value="${telefono}" required>
            </label>
            <label class="full">Indirizzo
                <input type="text" name="indirizzo" th:value="${indirizzo}" required>
            </label>

            <button type="submit" class="btn full register-submit">Registrati</button>
        </form>

        <p class="mt-12 register-footer">Hai gia un account? <a class="link" th:href="@{/auth}">Torna al login</a>.</p>
    </section>
</main>
</body>
</html>
