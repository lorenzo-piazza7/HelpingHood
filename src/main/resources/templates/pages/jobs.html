<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Elenco lavori')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('lavori')}"></div>
<main class="container">
    <h1>Elenco lavoretti</h1>
    <p>Dalla tua zona, per la tua zona.</p>

    <!-- Filtri lato client gestiti da app.js tramite data-attributes delle card. -->
    <section class="card filters">
        <label>Categoria
            <select id="filter-category">
                <option value="">Tutte</option>
                <option th:each="cat : ${categories}" th:value="${cat.name}" th:text="${cat.name}"></option>
            </select>
        </label>
        <label>Distanza max (km)
            <input id="filter-distance" type="number" min="0" max="20" step="0.5" placeholder="Es. 2">
        </label>
        <label>Orario max
            <input id="filter-time" type="time">
        </label>
        <label>Compenso min €/h
            <input id="filter-pay" type="number" min="0" step="1" placeholder="Es. 8">
        </label>
        <button type="button" class="btn btn-sm" id="clear-filters">Reset filtri</button>
    </section>

    <!-- Risultati annunci con azioni diverse in base al ruolo autenticato. -->
    <section class="grid cards-2" id="jobs-list">
        <article class="card job-card" th:each="job : ${jobs}"
                 th:with="isMine=${isGiovaneViewer and myRequestedJobIds.contains(job.id)},isTaken=${job.status != null and job.status != 'attivo'}"
                 th:attr="data-category=${job.category != null ? job.category : ''},
                          data-distance=${job.distanceKm},
                          data-time=${job.time != null ? #temporals.format(job.time, 'HH:mm') : ''},
                          data-pay=${job.hourlyCompensation != null ? job.hourlyCompensation : 0}">
            <div class="row-between">
                <span class="pill" th:text="${job.category}"></span>
                <div class="row-gap">
                    <span class="pill success" th:text="${job.distanceKm + ' km'}"></span>
                    <span class="pill young-status-pill" th:classappend="${isTaken ? 'booked' : 'active'}" th:text="${isTaken ? 'preso' : 'attivo'}"></span>
                </div>
            </div>
            <h3 th:text="${job.title}"></h3>
            <p th:text="${job.description}"></p>
            <p th:text="${job.zone + ' · ' + (job.day != null && job.time != null ? #temporals.format(job.day, 'dd/MM') + ' ' + #temporals.format(job.time, 'HH:mm') : 'Data da definire')}"></p>
            <div class="row-between mt-12">
                <strong th:text="${job.hourlyCompensation == null || job.hourlyCompensation == 0 ? 'Volontariato' : '€ ' + job.hourlyCompensation + '/h'}"></strong>
                <div class="row-gap" th:if="${isGiovaneViewer}">
                    <form class="inline-form" method="post" th:if="${isMine}" th:action="@{'/lavori/' + ${job.id} + '/annulla'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-light" type="submit">Annulla</button>
                    </form>
                    <form class="inline-form" method="post" th:if="${!isMine}" th:action="@{'/lavori/' + ${job.id} + '/richiedi'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm" type="submit" th:disabled="${isTaken}" th:text="${isTaken ? 'Preso' : 'Candidati'}"></button>
                    </form>
                    <a class="btn btn-sm btn-light" th:href="@{'/lavori/' + ${job.id}}">Dettaglio</a>
                </div>
                <a class="btn btn-sm" th:if="${!isGiovaneViewer}" th:href="@{'/lavori/' + ${job.id}}">Dettaglio</a>
            </div>
        </article>
    </section>
</main>
</body>
</html>
