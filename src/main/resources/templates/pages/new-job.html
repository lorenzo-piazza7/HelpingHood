<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crea annuncio')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('richiedente')}"></div>
<main class="container narrow">
    <section class="card">
        <h1>Nuovo annuncio</h1>
        <p>Compila i dettagli in modo semplice per trovare aiuto velocemente.</p>
        <form class="form-grid">
            <label>Titolo<input type="text" placeholder="Es. Aiuto spesa venerdì mattina"></label>
            <label>Categoria
                <select>
                    <option th:each="cat : ${categories}" th:text="${cat.name}"></option>
                </select>
            </label>
            <label class="full">Descrizione<textarea rows="4" placeholder="Descrivi in modo concreto cosa ti serve"></textarea></label>
            <label>Durata (ore)<input type="number" min="0.5" step="0.5" placeholder="2"></label>
            <label>Compenso indicativo €/h<input type="number" min="0" step="1" placeholder="8"></label>
            <label>Zona<input type="text" placeholder="Es. Lecco centro"></label>
            <label>Giorno<input type="date"></label>
            <label>Orario<input type="time"></label>
            <button type="button" class="btn">Pubblica annuncio</button>
        </form>
    </section>
</main>
</body>
</html>
